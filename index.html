<script>

let recetas = [];

let comprados =
JSON.parse(localStorage.getItem("comprados")) || [];

let despensa =
JSON.parse(localStorage.getItem("despensa")) || [];

const dias = [
"Lunes",
"Martes",
"Miércoles",
"Jueves",
"Viernes",
"Sábado",
"Domingo"
];

async function cargarRecetas() {

    try {

        const response = await fetch("./recetas.json");

        if (!response.ok) {
            throw new Error("Error HTTP " + response.status);
        }

        recetas = await response.json();

        console.log("Recetas cargadas:", recetas.length);

    } catch(error) {

        console.error(error);

        alert("No se pudo cargar recetas.json");

    }

}

function guardarDespensa(){

    localStorage.setItem(
        "despensa",
        JSON.stringify(despensa)
    );

}

function renderDespensa(){

    const zona =
    document.getElementById("despensa");

    zona.innerHTML = "";

    despensa.forEach((item,index)=>{

        zona.innerHTML += `
        <span class="tag">
            ${item}
            <button
                onclick="eliminarIngrediente(${index})"
                style="
                    margin-left:6px;
                    background:#d32f2f;
                    padding:2px 6px;
                    font-size:12px;
                    border:none;
                    border-radius:4px;
                    color:white;
                    cursor:pointer;
                ">
                ❌
            </button>
        </span>
        `;

    });

}

function agregarIngrediente(){

    const input =
    document.getElementById("ingredienteInput");

    const valor =
    input.value.trim();

    if(!valor) return;

    if(!despensa.includes(valor)){

        despensa.push(valor);

        guardarDespensa();

        renderDespensa();

    }

    input.value = "";

}

function eliminarIngrediente(index){

    despensa.splice(index,1);

    guardarDespensa();

    renderDespensa();

}

function toggleComprado(nombre){

    if(comprados.includes(nombre)){

        comprados =
        comprados.filter(
            x => x !== nombre
        );

    }else{

        comprados.push(nombre);

    }

    localStorage.setItem(
        "comprados",
        JSON.stringify(comprados)
    );

}

function generarMenu(){

    if(recetas.length === 0){

        alert(
            "Las recetas aún no se han cargado."
        );

        return;

    }

    const comidas =
    recetas.filter(
        r => r.tipo === "comida"
    );

    const cenas =
    recetas.filter(
        r => r.tipo === "cena"
    );

    if(comidas.length < 7 || cenas.length < 7){

        alert(
            "Necesitas al menos 7 comidas y 7 cenas."
        );

        return;

    }

    let html = "";
    let listaCompra = [];

    const comidasDisponibles = [...comidas];
    const cenasDisponibles = [...cenas];

    for(let i=0;i<7;i++){

        const comida =
        comidasDisponibles.splice(
            Math.floor(
                Math.random() *
                comidasDisponibles.length
            ),
            1
        )[0];

        const cena =
        cenasDisponibles.splice(
            Math.floor(
                Math.random() *
                cenasDisponibles.length
            ),
            1
        )[0];

        html += `
        <tr>
            <td>${dias[i]}</td>
            <td>${comida.nombre}</td>
            <td>${cena.nombre}</td>
        </tr>
        `;

        if(comida.ingredientes){
            listaCompra.push(...comida.ingredientes);
        }

        if(cena.ingredientes){
            listaCompra.push(...cena.ingredientes);
        }

    }

    document.getElementById("menu").innerHTML = html;

    const compraFiltrada =
    listaCompra.filter(ing =>

        !despensa.some(
            d =>
            d.toLowerCase() ===
            ing.nombre.toLowerCase()
        )
